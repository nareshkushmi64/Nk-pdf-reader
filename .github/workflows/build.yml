name: Build Release NK Reader APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # १. कोड रिपोजिटरी तान्ने
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    # २. जेटप्याक कम्पोज र आधुनिक ग्र्याडलका लागि जाभा १७ सेटअप
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # ३. इन्टरफेस र म्यानिफेस्ट फाइलमा नाम र प्याकेज नेम स्वचालित रूपमा अपडेट गर्ने
    - name: Configure Package Name and App Name dynamically
      run: |
        echo "Updating application identity parameters..."
        find . -type f -name "build.gradle*" -exec sed -i 's/applicationId ".*"/applicationId "com.nareshkushmi.nkreader"/g' {} +
        find . -type f -name "strings.xml" -exec sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">NK Reader<\/string>/g' {} +

    # ४. बिल्ड प्रकृया सफल बनाउन अस्थायी र सुरक्षित Release Keystore जेनेरेट गर्ने
    - name: Generate Temporary Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore \
        -alias nkreader_alias -keyalg RSA -keysize 2048 -validity 10000 \
        -storepass mysecretpassword -keypass mysecretpassword \
        -dname "CN=Naresh Kushmi, O=NK Reader, L=Kailali, C=NP"

    # ५. ग्र्याडललाई चलाउने पर्मिसन दिने
    - name: Grant Execute Permission for Gradle Wrapper
      run: chmod +x gradlew

    # ६. कमाण्ड लाइन मार्फत साइनिङ प्यारामिटर पास गर्दै सुरक्षित Release APK बिल्ड गर्ने (FIXED: Added Command Line Signing Flags)
    - name: Assemble Release APK
      run: |
        ./gradlew assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore \
          -Pandroid.injected.signing.store.password=mysecretpassword \
          -Pandroid.injected.signing.key.alias=nkreader_alias \
          -Pandroid.injected.signing.key.password=mysecretpassword

    # ७. गिटहब रनरको पाथबाट तयार भएको एपीके फाइल खोजेर बाहिर ल्याउने
    - name: Locate and Prepare Release APK File
      run: |
        mkdir -p release-output
        find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-output/NK_Reader_v1.0_Release.apk \;

    # ८. फाइनल 'NK_Reader_v1.0_Release.apk' लाई गिटहबको Artifacts मा राख्ने (FIXED: Corrected Action Name)
    - name: Upload NK Reader Release APK
      uses: actions/upload-artifact@v4
      with:
        name: NK-Reader-Final-Release-APK
        path: release-output/NK_Reader_v1.0_Release.apk
        if-no-files-found: error
        retention-days: 7
